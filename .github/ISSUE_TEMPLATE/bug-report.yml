name: Bug report
description: Something in this repository does not work as documented.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        A wrong value is a data issue: use the **report** link of the value, or
        [Report an error in a value](https://github.com/orchid-calphad/orchid-data/issues/new?template=report-value-error.yml)
        in orchid-data. Please do not include e-mail addresses, API keys or paper PDFs.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Page URL, tool call (name and arguments) or command, and its output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, package version or commit; Python version; browser.
