blank_issues_enabled: true
contact_links:
  - name: Report an error in a value
    url: https://github.com/orchid-calphad/orchid-data/issues/new?template=report-value-error.yml
    about: A value differs from what its paper prints (pre-filled from the report link of the value).
  - name: Suggest a paper or assessment
    url: https://github.com/orchid-calphad/orchid-data/issues/new?template=suggest-paper.yml
    about: DOIs of papers, datasets or CALPHAD assessments ORCHID should read.
  - name: Contribute data
    url: https://github.com/orchid-calphad/orchid-data/blob/main/CONTRIBUTING.md
    about: Corrections, values, measurements, calculations and TDB files, by pull request to orchid-data.
  - name: How to contribute (plain English)
    url: https://orchid-project.org/contribute/
    about: Every way to help ORCHID, and what happens to a contribution.
