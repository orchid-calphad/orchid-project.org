# Every commit of a pull request must carry a Signed-off-by line (Developer Certificate of Origin; CONTRIBUTING.md).
name: dco
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Every commit is signed off (git commit -s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --paginate --jq '.[] | select(.commit.message | test("(?m)^Signed-off-by: .+ <.+>") | not) | .sha')
          if [ -n "$missing" ]; then
            echo "::error::commits without a Signed-off-by line (use git commit -s; see CONTRIBUTING.md): $missing"
            exit 1
          fi
