# Tests of the release tools that need no data checkout (the report-link builder); the full suite needs orchid-data.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "pytest==9.1.1"
      - run: python -m pytest -q -p no:cacheprovider tools/tests/test_report_links.py
